<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152B">
  <title>Reset your Rolling Budget password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme:light; --ink:#181326; --muted:#645e78; --line:#e5e1f2; --purple:#7c3aed; --header:#17152B; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:#f8f7fc; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
    header { min-height:82px; display:flex; align-items:center; padding:16px max(22px,calc((100vw - 1120px)/2)); background:var(--header); border-bottom:1px solid #302D4B; color:#fff; }
    .brand { display:flex; align-items:center; gap:13px; }
    .mark { display:flex; align-items:flex-end; gap:5px; height:36px; }
    .mark span { display:block; width:9px; border-radius:3px; background:#8B7CFF; }
    .mark span:nth-child(1) { height:17px; }
    .mark span:nth-child(2) { height:26px; }
    .mark span:nth-child(3) { height:36px; background:#B1A6FF; }
    .wordmark { font-size:1.18rem; font-weight:750; letter-spacing:-.035em; }
    .wordmark span { color:#A99CFF; }
    main { width:min(100% - 32px,520px); margin:auto; padding:48px 0; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:22px; padding:clamp(24px,5vw,42px); box-shadow:0 16px 40px rgba(24,19,38,.07); }
    .brand-mark { display:flex; justify-content:center; margin:0 auto 18px; }
    .status-icon { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 18px; border-radius:50%; background:#ecfdf5; color:#047857; font-size:1.7rem; font-weight:800; }
    .status-icon.error { background:#fef2f2; color:#b91c1c; }
    h1 { margin:0 0 10px; text-align:center; font-size:clamp(1.45rem,5vw,1.9rem); line-height:1.2; letter-spacing:-.035em; }
    .intro { margin:0 auto 24px; max-width:390px; color:var(--muted); font-size:.95rem; text-align:center; }
    .field { margin:0 0 16px; }
    label { display:block; margin-bottom:7px; color:#514a65; font-size:.84rem; font-weight:700; }
    .input-wrap { display:flex; align-items:center; border:1px solid var(--line); border-radius:11px; background:#faf9fe; overflow:hidden; }
    input { width:100%; min-width:0; min-height:48px; padding:11px 13px; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:.95rem; }
    .input-wrap:focus-within { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12); }
    .toggle { min-width:58px; min-height:48px; padding:8px 10px; border:0; background:transparent; color:#6554C0; font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; }
    .hint { margin:6px 0 0; color:#827b91; font-size:.76rem; }
    .message { display:none; margin:0 0 16px; padding:11px 13px; border-radius:10px; font-size:.84rem; }
    .message.visible { display:block; }
    .message.error { background:#fef2f2; color:#b91c1c; }
    .message.success { background:#ecfdf5; color:#047857; }
    .primary { display:inline-flex; min-height:48px; align-items:center; justify-content:center; width:100%; padding:12px 18px; border:1px solid #6d28d9; border-radius:11px; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; font-family:inherit; font-size:.95rem; font-weight:700; line-height:1.2; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,.2); }
    .primary:disabled { opacity:.65; cursor:wait; }
    .primary:focus-visible, .toggle:focus-visible { outline:3px solid rgba(139,124,255,.55); outline-offset:3px; }
    .support { margin:18px 0 0; text-align:center; color:var(--muted); font-size:.84rem; }
    .support a { color:#6554C0; font-weight:700; }
    footer { padding:18px 16px; text-align:center; color:#827b91; font-size:.78rem; }
    @media(max-width:600px) {
      header { min-height:72px; padding:13px 18px; }
      .mark { gap:4px; height:32px; }
      .mark span { width:8px; }
      .mark span:nth-child(1) { height:15px; }
      .mark span:nth-child(2) { height:23px; }
      .mark span:nth-child(3) { height:32px; }
      .wordmark { font-size:1.04rem; }
      main { width:calc(100% - 24px); padding:28px 0; }
      .panel { border-radius:18px; padding:28px 20px; }
      .primary { min-height:48px; }
    }
  </style>
</head>
<body>
  <header><div class="brand" aria-label="Rolling Budget"><div class="mark" aria-hidden="true"><span></span><span></span><span></span></div><div class="wordmark">Rolling <span>Budget</span></div></div></header>
  <main>
    <section class="panel" aria-labelledby="pageTitle">
      <div id="statusIcon" class="status-icon" aria-hidden="true" hidden>✓</div>
      <h1 id="pageTitle">Verify your reset link</h1>
      <p id="intro" class="intro" role="status" aria-live="polite">Checking your secure password reset link. This may take a moment.</p>
      <form id="resetForm" hidden novalidate>
        <div id="formMessage" class="message" role="status" aria-live="polite"></div>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Create a new password"><button class="toggle" type="button" data-toggle="newPassword" aria-label="Show new password">Show</button></div>
          <p class="hint">Use at least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter your new password again"><button class="toggle" type="button" data-toggle="confirmPassword" aria-label="Show password confirmation">Show</button></div>
        </div>
        <button id="submitButton" class="primary" type="submit">Update password</button>
      </form>
      <a id="continueLink" class="primary" href="./rollover-budget-app.html" hidden>Continue to Rolling Budget</a>
      <p id="supportMessage" class="support" hidden><a href="./rollover-budget-app.html">Return to sign in</a></p>
    </section>
  </main>
  <footer>Plan smarter. Grow stronger.</footer>
  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const STAGING_STORAGE_PREFIX = "YOUR_STAGING_STORAGE_PREFIX";
    const title = document.getElementById("pageTitle");
    const intro = document.getElementById("intro");
    const form = document.getElementById("resetForm");
    const formMessage = document.getElementById("formMessage");
    const statusIcon = document.getElementById("statusIcon");
    const continueLink = document.getElementById("continueLink");
    const supportMessage = document.getElementById("supportMessage");
    const submitButton = document.getElementById("submitButton");
    let supabaseClient;
    let recoveryReady = false;
    let recoveryEventSeen = false;
    let authSubscription;

    function showMessage(message, type = "error") {
      formMessage.textContent = message;
      formMessage.className = "message visible " + type;
    }
    function showInvalidLink() {
      form.hidden = true;
      statusIcon.hidden = false;
      statusIcon.textContent = "!";
      statusIcon.classList.add("error");
      title.textContent = "This reset link is invalid or has expired";
      intro.textContent = "For your security, password reset links can only be used once and may expire. Return to Rolling Budget and request a new reset link.";
      supportMessage.hidden = false;
      continueLink.hidden = true;
    }
    function showResetForm() {
      recoveryReady = true;
      statusIcon.hidden = true;
      title.textContent = "Create a new password";
      intro.textContent = "Choose a new password for your Rolling Budget account.";
      form.hidden = false;
      supportMessage.hidden = true;
    }
    function showSuccess() {
      form.hidden = true;
      statusIcon.hidden = false;
      statusIcon.classList.remove("error");
      statusIcon.textContent = "✓";
      title.textContent = "Your password has been updated";
      intro.textContent = "Your password is ready to use. Sign in to continue managing your budget.";
      continueLink.hidden = false;
      supportMessage.hidden = true;
    }
    document.querySelectorAll("[data-toggle]").forEach(button => button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.toggle);
      const reveal = input.type === "password";
      input.type = reveal ? "text" : "password";
      button.textContent = reveal ? "Hide" : "Show";
      button.setAttribute("aria-label", reveal ? "Hide password" : (input.id === "newPassword" ? "Show new password" : "Show password confirmation"));
    }));

    async function initializeReset() {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const errorCode = query.get("error_code") || query.get("error") || hash.get("error_code") || hash.get("error");
      const hasRecoveryCallback = Boolean(query.get("code") || hash.get("access_token") || hash.get("token_hash") || hash.get("type") === "recovery");
      if (errorCode || !hasRecoveryCallback || !window.supabase || !SUPABASE_URL || !SUPABASE_ANON_KEY || !STAGING_STORAGE_PREFIX) {
        showInvalidLink();
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { storageKey: STAGING_STORAGE_PREFIX + "_auth", detectSessionInUrl: true }
        });
        const { data: subscription } = await supabaseClient.auth.onAuthStateChange(event => {
          if (event === "PASSWORD_RECOVERY") {
            recoveryEventSeen = true;
            showResetForm();
          }
        });
        authSubscription = subscription?.subscription;
        const { data, error } = await supabaseClient.auth.getSession();
        if (error || !data?.session || !recoveryEventSeen) {
          showInvalidLink();
          return;
        }
      } catch (error) {
        showInvalidLink();
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!recoveryReady || !supabaseClient) return;
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 8) {
        showMessage("Your password must be at least 8 characters long.");
        document.getElementById("newPassword").focus();
        return;
      }
      if (password !== confirmation) {
        showMessage("The passwords do not match. Please try again.");
        document.getElementById("confirmPassword").focus();
        return;
      }
      submitButton.disabled = true;
      submitButton.textContent = "Updating password…";
      try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        authSubscription?.unsubscribe();
        showSuccess();
      } catch (error) {
        showMessage("We couldn't update your password. Please request a new reset link and try again.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });

    initializeReset();
  </script>
</body>
</html>
