name: B4 PostgreSQL RLS and date contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-replay-only
          POSTGRES_DB: migration_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-replay-only
      PGDATABASE: migration_replay
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Rebuild staging schema using B1 baseline
        run: bash scripts/verify-clean-migration-replay.sh
      - name: Test owner isolation and recurring constraints as authenticated
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/verify-b4-postgres-contract.sql
      - name: Test concurrent recurring reference and account deletion
        run: bash scripts/verify-b3-account-races.sh
