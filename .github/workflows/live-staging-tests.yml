name: Live staging auth and database tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-staging-database-tests
  cancel-in-progress: false
jobs:
  integration:
    if: github.ref == 'refs/heads/main'
    environment: staging-live-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install runner without lifecycle scripts and install Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the current staging application
        run: node scripts/build-staging.mjs
      - name: Validate authenticated tests without credentials
        run: |
          node --check tests/live/authenticated.spec.js
          node --check scripts/live-staging-tests.mjs
          node --test tests/live/safety.test.mjs
          npx playwright test --config=playwright.live.config.js --list
      - name: Test real authentication and current-table ownership policies
        run: node scripts/live-staging-tests.mjs
        env:
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
          STAGING_TEST_A_EMAIL: ${{ secrets.STAGING_TEST_A_EMAIL }}
          STAGING_TEST_A_PASSWORD: ${{ secrets.STAGING_TEST_A_PASSWORD }}
          STAGING_TEST_B_EMAIL: ${{ secrets.STAGING_TEST_B_EMAIL }}
          STAGING_TEST_B_PASSWORD: ${{ secrets.STAGING_TEST_B_PASSWORD }}
      - name: Run authenticated desktop acceptance
        run: npx playwright test --config=playwright.live.config.js
        env:
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
          STAGING_TEST_A_EMAIL: ${{ secrets.STAGING_TEST_A_EMAIL }}
          STAGING_TEST_A_PASSWORD: ${{ secrets.STAGING_TEST_A_PASSWORD }}
          STAGING_TEST_B_EMAIL: ${{ secrets.STAGING_TEST_B_EMAIL }}
          STAGING_TEST_B_PASSWORD: ${{ secrets.STAGING_TEST_B_PASSWORD }}
      - name: Remove sensitive temporary browser outputs
        if: always()
        run: rm -rf test-results playwright-report playwright/.auth
