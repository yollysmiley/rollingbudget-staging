name: Staging PostgreSQL regression contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-postgres-${{ github.event.pull_request.number || github.ref }}
  # Preserve main-branch checks; cancel only superseded PR revisions.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-replay-only
          POSTGRES_DB: migration_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-replay-only
      PGDATABASE: migration_replay
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: B3 populated upgrade, orphan refusal, rollback and idempotence
        run: bash scripts/verify-b3-upgrade.sh
      - name: Reset disposable database before clean migration replay
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE migration_replay WITH (FORCE);'
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE migration_replay;'
      - name: B1 clean migration replay and schema assertions
        run: bash scripts/verify-clean-migration-replay.sh
      - name: B4 authenticated owner isolation and recurring constraints
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/verify-b4-postgres-contract.sql
      - name: B4 concurrent recurring reference and account deletion
        run: bash scripts/verify-b3-account-races.sh
