name: Build, test and deploy isolated staging frontend
on:
  push:
    branches: [main, ci/staging-browser-tests]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pinned test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build redesigned UI with staging-only configuration
        run: node scripts/build-staging.mjs
      - name: Run redesigned UI build and rendering regression tests
        run: node --test tests/empty-budget-state.test.mjs tests/security-rendering.test.mjs
      - name: Run desktop and mobile acceptance tests
        run: npm run test:e2e
      - name: Retain browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload static staging build
        uses: actions/upload-artifact@v4
        with:
          name: staging-frontend
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redesigned staging app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
