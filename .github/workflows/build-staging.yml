name: Build and deploy isolated staging frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out pinned application source
        uses: actions/checkout@v5
        with:
          repository: yollysmiley/rollingbudget
          ref: 3c9277bb5dd3209c603a8fd1e952583970136385
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build with staging-only configuration
        run: node scripts/build-staging.mjs upstream/rollover-budget-app.html
      - name: Upload static staging build
        uses: actions/upload-artifact@v4
        with:
          name: staging-frontend
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
